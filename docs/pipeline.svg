<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title">
  <title id="title">Problem Radar pipeline: collect, cluster, score, report</title>
  <style>
    .box { fill: #161b22; stroke: #2a323d; stroke-width: 1.5; rx: 10; }
    .label { fill: #e6edf3; font: 600 14px -apple-system, Segoe UI, Roboto, sans-serif; }
    .sub { fill: #8b949e; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#head); }
    .note { fill: #8b949e; font: 12px -apple-system, Segoe UI, Roboto, sans-serif; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="880" height="360" fill="#0e1116"/>

  <rect class="box" x="30" y="30" width="190" height="80"/>
  <text class="label" x="46" y="60">Public sources</text>
  <text class="sub" x="46" y="80">HN · GitHub · RSS</text>
  <text class="sub" x="46" y="97">manual JSONL</text>

  <rect class="box" x="260" y="30" width="190" height="80"/>
  <text class="label" x="276" y="60">Collect</text>
  <text class="sub" x="276" y="80">throttle · retries</text>
  <text class="sub" x="276" y="97">title noise filter</text>

  <rect class="box" x="490" y="30" width="170" height="80"/>
  <text class="label" x="506" y="60">signals.jsonl</text>
  <text class="sub" x="506" y="80">append-only</text>
  <text class="sub" x="506" y="97">dedupe by source id</text>

  <rect class="box" x="700" y="30" width="150" height="80"/>
  <text class="label" x="716" y="60">Cluster</text>
  <text class="sub" x="716" y="80">IDF similarity</text>
  <text class="sub" x="716" y="97">union-find</text>

  <rect class="box" x="700" y="150" width="150" height="80"/>
  <text class="label" x="716" y="180">Score</text>
  <text class="sub" x="716" y="200">6 components</text>
  <text class="sub" x="716" y="217">× corroboration</text>

  <rect class="box" x="430" y="150" width="200" height="80"/>
  <text class="label" x="446" y="180">clusters.json</text>
  <text class="sub" x="446" y="200">score · solutions</text>
  <text class="sub" x="446" y="217">status · note</text>

  <rect class="box" x="430" y="270" width="200" height="60"/>
  <text class="label" x="446" y="300">Markdown report</text>
  <text class="sub" x="446" y="318">evidence · limits</text>

  <rect class="box" x="150" y="270" width="220" height="60"/>
  <text class="label" x="166" y="300">Human decision</text>
  <text class="sub" x="166" y="318">approve · reject · research</text>

  <line class="arrow" x1="220" y1="70" x2="258" y2="70"/>
  <line class="arrow" x1="450" y1="70" x2="488" y2="70"/>
  <line class="arrow" x1="660" y1="70" x2="698" y2="70"/>
  <line class="arrow" x1="775" y1="110" x2="775" y2="148"/>
  <line class="arrow" x1="700" y1="190" x2="632" y2="190"/>
  <line class="arrow" x1="530" y1="230" x2="530" y2="268"/>
  <line class="arrow" x1="430" y1="300" x2="372" y2="300"/>

  <text class="note" x="30" y="345">The score ranks leads; a person decides. Nothing is built or published by the tool.</text>
</svg>
