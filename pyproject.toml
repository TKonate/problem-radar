[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "problem-radar"
version = "0.1.0"
description = "Collect public problem signals, cluster them and score opportunities with an explainable rationale"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "T. Konate", email = "ti.konate@proton.me" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
radar = "problem_radar.cli:main"

[project.urls]
Homepage = "https://github.com/TKonate/problem-radar"

[tool.setuptools.packages.find]
where = ["."]
include = ["problem_radar*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
packages = ["problem_radar"]
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["problem_radar"]
